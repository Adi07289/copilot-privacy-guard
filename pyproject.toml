[project]
name = "copilot-privacy-guard"
version = "0.1.0"
description = "Privacy-guard middleware prototype for retrieval-augmented enterprise LLM assistants (DPDP-aligned)"
requires-python = ">=3.11"
dependencies = [
  "faker>=30",
  "scikit-learn>=1.5",
  "numpy>=1.26",
  "openai>=1.40",
  "streamlit>=1.38",
  "python-dotenv>=1.0",
]
[project.optional-dependencies]
dev = ["pytest>=8"]
ner = ["spacy>=3.7"]
compare = ["presidio-analyzer>=2.2"]
dense = ["fastembed>=0.4"]
docs = ["matplotlib>=3.8", "python-docx>=1.1", "python-pptx>=1.0", "docx2pdf>=0.1.8", "pymupdf>=1.24,<1.26"]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["privacyguard*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
